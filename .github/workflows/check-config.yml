name: check-config

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu-latest; no third-party action needed.
      - run: shellcheck --shell=bash scripts/*.sh hooks/*.sh
      - run: bash scripts/check-config.sh
